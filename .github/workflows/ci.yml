# Tier-2 AI-guardrail CI gate (see ARCHITECTURE_PLAN.md §1.3, §14).
#
# Every PR runs the same checks `make agent-verify` runs locally: fmt, clippy,
# tests, cargo-deny (advisories + licenses + sources + bans), cargo-machete
# (unused deps), npm lint, npm build. A merge cannot proceed until this is green.
#
# This is the **only** CI workflow today. If we add others (release, deploy,
# canary…), they must not weaken this gate — they extend it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Backend env vars are intentionally not set here; the verify script
  # supplies stand-in values when they are unset so the test suite runs
  # end-to-end without contacting external services.
  # See AGENTS.md "Cursor Cloud specific instructions" for the rationale.

jobs:
  agent-verify:
    name: agent-verify (fmt, clippy, test, deny, machete, frontend lint+build)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # All third-party actions are pinned to a full commit SHA per the
      # tier-2 supply-chain rule (mutable @v4 tags can be re-pointed by a
      # compromised maintainer; the SHA is the only immutable reference).
      # The trailing `# vN.N.N` comment names the release the SHA pins so
      # bumps stay reviewable. Update via:
      #   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Don't leave the GITHUB_TOKEN behind in `.git/config` after the
          # checkout step finishes; any subsequent step that runs untrusted
          # code (e.g. compiling a dependency with a build.rs) would otherwise
          # be able to read it. We don't push from this workflow.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # The Rust toolchain version is pinned via backend/rust-toolchain.toml.
      # `dtolnay/rust-toolchain` reads that file when `toolchain: stable` is
      # combined with the working directory below, but to be explicit we let
      # the file drive the install via `rustup show` inside `backend/`.
      - name: Install Rust toolchain (from backend/rust-toolchain.toml)
        run: |
          rustup show active-toolchain || true
          (cd backend && rustup show)
          rustup component add rustfmt clippy

      - name: Cache Cargo registry + git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      # Tier-2 supply-chain tooling. `--locked` to keep the installed
      # versions reproducible from the same Cargo.lock everyone else uses.
      - name: Install cargo-deny + cargo-machete
        run: |
          cargo install --locked cargo-deny cargo-machete

      - name: verify-tracked (no build artifacts in git)
        run: make verify-tracked

      - name: agent-verify (full gate)
        run: make agent-verify
