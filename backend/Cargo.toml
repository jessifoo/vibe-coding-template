[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Full-stack application backend with Axum 0.8, Supabase, and LLM integration (Rust 2024 edition, MSRV 1.85)"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }

# Async runtime
tokio = { version = "1", features = ["full", "tracing"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment (.env loading)
dotenvy = "0.15"

# HTTP client (Supabase, Anthropic — services without a Rust SDK)
# `rustls-tls` was renamed to `rustls` in reqwest 0.13; default-features still
# disabled so we don't pull in `native-tls` / `openssl-sys` via `default-tls`.
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# URL encoding (PostgREST filter query parts)
urlencoding = "2.1"

# Async traits (SOLID-style service abstractions behind trait objects)
async-trait = "0.1"

# LLM integrations (typed OpenAI SDK). 0.41 split the SDK into per-endpoint
# feature flags; we opt into `chat-completion` (the only async-openai endpoint
# we use today — embeddings still go via raw reqwest).
async-openai = { version = "0.41", default-features = false, features = ["rustls", "chat-completion"] }

# Vector database
qdrant-client = "1"

[dev-dependencies]
# `tower::util::ServiceExt` (`oneshot`) is used by integration tests to drive
# the Axum router without binding a TCP port.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Default Clippy set at warn; unwrap/expect are errors in production (tests opt out below).
all = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
# AI-guardrail tier-1 lints (see ARCHITECTURE_PLAN.md §1.3 / §14):
#   - todo/unimplemented/dbg are signs of an unfinished or experimental change
#     that should not reach a commit.
#   - print_stdout forbids ad-hoc println!; structured logging via `tracing`
#     is the only sanctioned route. eprintln! is still allowed for the
#     pre-tracing startup-error path (see main.rs and config/mod.rs).
todo = { level = "deny", priority = 0 }
unimplemented = { level = "deny", priority = 0 }
dbg_macro = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
# Method/type bans (see backend/clippy.toml `disallowed-methods` /
# `disallowed-types`). Promote the clippy default `warn` to `deny`.
disallowed_methods = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 0 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
