[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Full-stack application backend with Axum, Supabase, and LLM integration"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# Async runtime
tokio = { version = "1", features = ["full", "tracing"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment (.env loading)
dotenvy = "0.15"

# HTTP client (Supabase, Anthropic — services without a Rust SDK)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# JWT handling
jsonwebtoken = "9"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# URL encoding (PostgREST filter query parts)
urlencoding = "2.1"

# Async traits (SOLID-style service abstractions behind trait objects)
async-trait = "0.1"

# LLM integrations (typed OpenAI SDK)
async-openai = "0.27"

# Vector database
qdrant-client = "1"

[dev-dependencies]
# `tower::util::ServiceExt` (`oneshot`) is used by integration tests to drive
# the Axum router without binding a TCP port.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Default Clippy set at warn; unwrap/expect are errors in production (tests opt out below).
all = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
